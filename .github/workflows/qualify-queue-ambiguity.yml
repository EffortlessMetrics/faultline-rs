name: Qualify queue ambiguity reports

on:
  push:
    branches: [work/queue-review-qualification]
    paths: [.github/workflows/qualify-queue-ambiguity.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: queue-admission-review
  cancel-in-progress: false

env:
  INPUT_SHA: d9da273fd69a81e97e6e11818443798e0dcd7549
  CARGO_TERM_COLOR: never

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/jactionlint@9e87e8f34edfc00b849a27807e26eff9d00b936d
        with:
          config-file: .github/jactionlint.yaml
          profile: correctness
          online: false
          args: --shellcheck= --pyflakes=
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-queue-ambiguity-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-queue-external-review-fixed-
            ${{ runner.os }}-queue-planning-review-
            ${{ runner.os }}-cargo-
      - name: Reproduce lost evidence and overbroad windows
        run: |
          git checkout --detach "$INPUT_SHA"
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          mkdir -p "$RUNNER_TEMP/queue-ambiguity"
          git rev-parse HEAD > "$RUNNER_TEMP/queue-ambiguity/input-sha.txt"
          rustc --version --verbose > "$RUNNER_TEMP/queue-ambiguity/toolchain.txt"
          python3 - <<'PY'
          from pathlib import Path
          Path('crates/faultline-queue/tests/ambiguity.rs').write_text(r'''mod common;

          use common::{add, endpoints, packet};
          use faultline_integration::{IntegrationOutcome, StateEquivalence};
          use faultline_queue::{DiagnosisInput, DiagnosisReport, DiagnosisStatus, EvidenceSource, diagnose};
          use std::fs;
          use std::path::PathBuf;
          use std::process::Command;

          type TestResult = Result<(), Box<dyn std::error::Error>>;

          fn unstable_packet() -> Result<DiagnosisInput, Box<dyn std::error::Error>> {
              let mut input = packet(20)?;
              endpoints(&mut input)?;
              add(&mut input, 10, "stable-pass", true, EvidenceSource::Provider)?;
              add(&mut input, 12, "conflict-pass", true, EvidenceSource::Provider)?;
              add(&mut input, 12, "conflict-fail", false, EvidenceSource::Provider)?;
              add(&mut input, 15, "stable-fail", false, EvidenceSource::Provider)?;
              Ok(input)
          }

          fn window(report: &DiagnosisReport) -> Result<(usize, usize, usize), Box<dyn std::error::Error>> {
              match &report.outcome {
                  Some(IntegrationOutcome::SuspectTransitions { lower_bound_exclusive, upper_bound_inclusive, transitions, .. }) => Ok((lower_bound_exclusive.ordinal, upper_bound_inclusive.ordinal, transitions.len())),
                  _ => Err("expected a suspect interval".into()),
              }
          }

          fn reversal_pairs(report: &DiagnosisReport) -> Result<Vec<(usize, usize)>, Box<dyn std::error::Error>> {
              let value = serde_json::to_value(report)?;
              let reversals = value.pointer("/outcome/NonMonotonic/reversals").and_then(serde_json::Value::as_array).ok_or("missing observed reversals")?;
              reversals.iter().map(|reversal| {
                  let lower = reversal.pointer("/failing_state/ordinal").and_then(serde_json::Value::as_u64).ok_or("missing failing state")?;
                  let upper = reversal.pointer("/later_passing_state/ordinal").and_then(serde_json::Value::as_u64).ok_or("missing later passing state")?;
                  Ok((usize::try_from(lower)?, usize::try_from(upper)?))
              }).collect()
          }

          #[test]
          fn non_monotonic_outcome_retains_the_observed_interval() -> TestResult {
              let mut input = packet(20)?;
              endpoints(&mut input)?;
              add(&mut input, 4, "fail4", false, EvidenceSource::Provider)?;
              add(&mut input, 8, "pass8", true, EvidenceSource::Provider)?;
              let report = diagnose(&input)?;
              assert_eq!(report.status, DiagnosisStatus::NonMonotonic);
              match &report.outcome {
                  Some(IntegrationOutcome::NonMonotonic { lower_bound_exclusive, upper_bound_inclusive, transitions, .. }) => {
                      assert_eq!(lower_bound_exclusive.as_ref().map(|s| s.ordinal), Some(4), "known failing state was discarded");
                      assert_eq!(upper_bound_inclusive.as_ref().map(|s| s.ordinal), Some(8));
                      assert_eq!(transitions.len(), 4);
                  }
                  _ => return Err("missing non-monotonic outcome".into()),
              }
              assert_eq!(reversal_pairs(&report)?, vec![(4, 8)]);
              assert!(report.next_probe.is_none());
              Ok(())
          }

          #[test]
          fn non_monotonic_outcome_preserves_multiple_reversal_segments() -> TestResult {
              let mut input = packet(20)?;
              endpoints(&mut input)?;
              for (ordinal, passing) in [(4, false), (8, true), (10, false), (12, true)] {
                  add(&mut input, ordinal, &format!("sample-{ordinal}"), passing, EvidenceSource::Provider)?;
              }
              let report = diagnose(&input)?;
              assert_eq!(reversal_pairs(&report)?, vec![(4, 8), (10, 12)]);
              let value = serde_json::to_value(&report)?;
              assert_eq!(value.pointer("/outcome/NonMonotonic/reversals/0/transitions").and_then(serde_json::Value::as_array).map(Vec::len), Some(4));
              assert_eq!(value.pointer("/outcome/NonMonotonic/reversals/1/transitions").and_then(serde_json::Value::as_array).map(Vec::len), Some(2));
              assert!(report.next_probe.is_none());
              Ok(())
          }

          #[test]
          fn incomplete_samples_retain_reversals_without_claiming_stability() -> TestResult {
              let mut input = packet(20)?;
              input.policy.minimum_attempts = 2;
              add(&mut input, 4, "fail4", false, EvidenceSource::Provider)?;
              add(&mut input, 8, "pass8", true, EvidenceSource::Provider)?;
              let report = diagnose(&input)?;
              assert_eq!(report.status, DiagnosisStatus::NonMonotonic);
              assert_eq!(reversal_pairs(&report)?, vec![(4, 8)]);
              assert_eq!(report.states.get(4).ok_or("state")?.target_failures, 1);
              assert!(report.next_probe.is_none());
              Ok(())
          }

          #[test]
          fn unstable_interior_retains_the_nearest_supported_bounds() -> TestResult {
              let report = diagnose(&unstable_packet()?)?;
              assert_eq!(report.status, DiagnosisStatus::Suspect);
              assert_eq!(window(&report)?, (10, 15, 5), "stable interior bounds were discarded");
              assert!(report.reason_codes.contains(&"conflicting_attempts".into()));
              assert!(report.next_probe.is_none());
              Ok(())
          }

          #[test]
          fn conservative_conflict_window_keeps_unobserved_earlier_prefix() -> TestResult {
              let mut input = unstable_packet()?;
              input.policy.assume_monotonic = false;
              let report = diagnose(&input)?;
              assert_eq!(window(&report)?, (0, 15, 15), "a sampled pass cannot prove the entire earlier prefix");
              Ok(())
          }

          #[test]
          fn conservative_conflict_window_can_use_a_complete_passing_prefix() -> TestResult {
              let mut input = unstable_packet()?;
              input.policy.assume_monotonic = false;
              for ordinal in 1..10 {
                  add(&mut input, ordinal, &format!("prefix-{ordinal}"), true, EvidenceSource::Provider)?;
              }
              assert_eq!(window(&diagnose(&input)?)?, (10, 15, 5));
              Ok(())
          }

          #[test]
          fn weak_passing_evidence_cannot_tighten_a_conflict_window() -> TestResult {
              let mut input = unstable_packet()?;
              input.sequence.states.get_mut(10).ok_or("state")?.equivalence = StateEquivalence::PatchEquivalent;
              let report = diagnose(&input)?;
              assert_eq!(window(&report)?, (0, 15, 15));
              assert_eq!(report.excluded_receipts.len(), 1);
              Ok(())
          }

          struct Scratch(PathBuf);
          impl Drop for Scratch {
              fn drop(&mut self) {
                  if let Err(error) = fs::remove_dir_all(&self.0) {
                      eprintln!("ambiguity fixture cleanup failed: {error}");
                  }
              }
          }

          #[test]
          fn markdown_exposes_the_observed_reversal_without_blame() -> TestResult {
              let mut input = packet(20)?;
              endpoints(&mut input)?;
              add(&mut input, 4, "fail4", false, EvidenceSource::Provider)?;
              add(&mut input, 8, "pass8", true, EvidenceSource::Provider)?;
              let stamp = std::time::SystemTime::now().duration_since(std::time::UNIX_EPOCH)?.as_nanos();
              let path = std::env::temp_dir().join(format!("faultline-ambiguity-{}-{stamp}", std::process::id()));
              fs::create_dir(&path)?;
              let scratch = Scratch(path);
              let source = scratch.0.join("input.json");
              fs::write(&source, serde_json::to_vec(&input)?)?;
              let output = Command::new(env!("CARGO_BIN_EXE_faultline-queue")).args(["diagnose", "--input"]).arg(source).args(["--format", "markdown"]).output()?;
              assert_eq!(output.status.code(), Some(2));
              let text = String::from_utf8(output.stdout)?;
              assert!(text.contains("Observed reversal: target failure at S4; passing sample at S8; 4 transitions between them."), "operator report lost the contrary samples");
              assert!(text.contains("No supported first-transition attribution."));
              Ok(())
          }

          #[test]
          fn conflicting_attempts_never_become_a_single_transition_claim() -> TestResult {
              let report = diagnose(&unstable_packet()?)?;
              assert_eq!(report.status, DiagnosisStatus::Suspect);
              assert!(!matches!(report.outcome, Some(IntegrationOutcome::FirstFailingTransition { .. })));
              assert!(report.next_probe.is_none());
              Ok(())
          }
          ''', encoding='utf-8')
          PY
          cargo fmt --all
          set +e
          cargo test --locked -p faultline-queue --test ambiguity > "$RUNNER_TEMP/queue-ambiguity/red.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/queue-ambiguity/red.log"
          test "$code" -eq 101
          for name in non_monotonic_outcome_retains_the_observed_interval non_monotonic_outcome_preserves_multiple_reversal_segments incomplete_samples_retain_reversals_without_claiming_stability unstable_interior_retains_the_nearest_supported_bounds conservative_conflict_window_keeps_unobserved_earlier_prefix conservative_conflict_window_can_use_a_complete_passing_prefix weak_passing_evidence_cannot_tighten_a_conflict_window markdown_exposes_the_observed_reversal_without_blame; do
            grep -F "test $name ... FAILED" "$RUNNER_TEMP/queue-ambiguity/red.log"
          done
          grep -F '1 passed; 8 failed;' "$RUNNER_TEMP/queue-ambiguity/red.log"
      - name: Preserve contrary evidence and policy-supported suspect bounds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          def once(text, old, new):
              assert text.count(old) == 1, old
              return text.replace(old, new)
          path = Path('crates/faultline-integration/src/lib.rs')
          text = path.read_text()
          needle = '#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, JsonSchema)]\npub enum IntegrationOutcome {'
          replacement = '''/// Contrary samples at distinct ordered states, not proof of stable recovery.
          /// Every transition in the intervening interval is retained without blame.
          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, JsonSchema)]
          pub struct IntegrationReversal {
              pub failing_state: IntegrationStateRef,
              pub later_passing_state: IntegrationStateRef,
              pub transitions: Vec<ChangeUnit>,
          }

          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, JsonSchema)]
          pub enum IntegrationOutcome {'''
          text = once(text, needle, replacement)
          text = once(text, '                        transitions: Vec::new(),\n                        confidence: None,', '                        transitions: Vec::new(),\n                        reversals: Vec::new(),\n                        confidence: None,')
          text = once(text, '                confidence: Some(confidence.clone()),', '                reversals: Vec::new(),\n                confidence: Some(confidence.clone()),')
          text = once(text, '        transitions: Vec<ChangeUnit>,\n        confidence: Option<Confidence>,', '        transitions: Vec<ChangeUnit>,\n        #[serde(default, skip_serializing_if = "Vec::is_empty")]\n        reversals: Vec<IntegrationReversal>,\n        confidence: Option<Confidence>,')
          path.write_text(text)
          path = Path('crates/faultline-queue/src/lib.rs')
          text = path.read_text()
          text = once(text, '    IntegrationOutcome, IntegrationSequence, IntegrationStateRef, LocalizationBasis,', '    IntegrationOutcome, IntegrationReversal, IntegrationSequence, IntegrationStateRef, LocalizationBasis,')
          text = once(text, 'fn plan(input: &DiagnosisInput, report: &mut DiagnosisReport) -> Result<()> {', '''fn observed_reversals(input: &DiagnosisInput, states: &[StateSummary]) -> Vec<IntegrationReversal> {
              let mut reversals = Vec::new();
              let mut previous_failure: Option<&StateSummary> = None;
              for summary in states {
                  // Process passing samples first: one flaky state is not its own reversal.
                  if summary.passing_attempts > 0 {
                      if let Some(failing) = previous_failure.take() {
                          reversals.push(IntegrationReversal {
                              failing_state: failing.state.clone(),
                              later_passing_state: summary.state.clone(),
                              transitions: input.sequence.states.iter()
                                  .filter(|state| state.ordinal > failing.state.ordinal && state.ordinal <= summary.state.ordinal)
                                  .filter_map(|state| state.transition.clone())
                                  .collect(),
                          });
                      }
                  }
                  if summary.target_failures > 0 {
                      previous_failure = Some(summary);
                  }
              }
              reversals
          }

          fn plan(input: &DiagnosisInput, report: &mut DiagnosisReport) -> Result<()> {''')
          old = '''        report.outcome = Some(input.sequence.map_localization_outcome(
                      &LocalizationOutcome::Inconclusive {
                          reasons: vec![AmbiguityReason::NonMonotonicEvidence],
                      },
                      input.policy.required_equivalence,
                  )?);'''
          old = '\n'.join([
              '        report.outcome = Some(input.sequence.map_localization_outcome(',
              '            &LocalizationOutcome::Inconclusive {',
              '                reasons: vec![AmbiguityReason::NonMonotonicEvidence],',
              '            },',
              '            input.policy.required_equivalence,',
              '        )?);',
          ])
          new = '''        let failing = report.states.get(failure).ok_or_else(|| invalid("missing contrary failure state"))?;
                  let passing = report.states.get(pass).ok_or_else(|| invalid("missing contrary passing state"))?;
                  let mut outcome = input.sequence.map_localization_outcome(
                      &LocalizationOutcome::SuspectWindow {
                          lower_bound_exclusive: failing.state.commit.clone(),
                          upper_bound_inclusive: passing.state.commit.clone(),
                          confidence: Confidence::low(),
                          reasons: vec![AmbiguityReason::NonMonotonicEvidence],
                      },
                      input.policy.required_equivalence,
                  )?;
                  if let IntegrationOutcome::NonMonotonic { reversals, .. } = &mut outcome {
                      *reversals = observed_reversals(input, &report.states);
                  }
                  report.outcome = Some(outcome);'''
          text = once(text, old, new)
          start = text.index('    if has_unstable {')
          end = text.index('        report.status = DiagnosisStatus::Suspect;', start)
          text = text[:start] + '''    if has_unstable {
                  // Only the declared monotonic policy can exclude an unobserved
                  // earlier prefix from a first-failure suspect interval.
                  let lower = if input.policy.assume_monotonic {
                      last_pass.unwrap_or(0)
                  } else {
                      report.states.iter().take_while(|s| s.evidence == StateEvidence::Passing).count().saturating_sub(1)
                  };
                  let upper = first_failure.ok_or_else(|| invalid("missing stable failing bound"))?;
                  let base = input.sequence.states.get(lower).ok_or_else(|| invalid("missing stable passing bound"))?;
                  let head = input.sequence.states.get(upper).ok_or_else(|| invalid("missing stable failing bound"))?;
          ''' + text[end:]
          path.write_text(text)
          path = Path('crates/faultline-queue/src/main.rs')
          text = path.read_text()
          needle = '            _ => text.push_str("\\nNo supported first-transition attribution.\\n"),'
          replacement = '''            faultline_integration::IntegrationOutcome::NonMonotonic { reversals, .. } => {
                          text.push_str("\\nNo supported first-transition attribution.\\n");
                          for reversal in reversals {
                              text.push_str(&format!(
                                  "\\nObserved reversal: target failure at S{}; passing sample at S{}; {} transitions between them.\\n",
                                  reversal.failing_state.ordinal,
                                  reversal.later_passing_state.ordinal,
                                  reversal.transitions.len(),
                              ));
                          }
                          text.push_str("\\nThese contrary samples do not prove stable recovery or an independently defective PR.\\n");
                      }
                      _ => text.push_str("\\nNo supported first-transition attribution.\\n"),'''
          path.write_text(once(text, needle, replacement))
          path = Path('docs/queue-diagnosis.md')
          path.write_text(path.read_text() + '''\n## Ambiguous evidence remains actionable\n\nNon-monotonic output retains the observed contrary-state interval and its\ntransitions. Its `reversals` list separately records each observed failing-state\nto later-passing-state segment and the changes between them. Repeated failing\nsamples use the most recent failing state before the next passing state; multiple\nsegments remain distinct. These are eligible samples, not claims of stable\nrecovery, a single first failure, or independent blame. Incomplete repeated-sample\nsets can still contain contrary evidence. Markdown displays the reversal segments.\n\nAn unstable interior state does not erase stable bounds. Under the explicit\nmonotonic policy, the nearest supported stable pass/fail bounds define the suspect\nwindow. Without that assumption, the lower bound advances only through a complete\nobserved passing prefix. Missing earlier states remain suspects; weak/ineligible\nreceipts cannot tighten the window. Conflicts stay conflicts and launch no new\nprobe in this policy. Multiple cross-state reversals produce the non-monotonic\nrepresentation rather than a misleading single first-transition claim.\n''')
          path = Path('docs/scenarios/scenario_index.md')
          text = path.read_text()
          names = re.findall(r'#\[test\]\s*fn\s+(\w+)', Path('crates/faultline-queue/tests/ambiguity.rs').read_text())
          rows = [f'| `{name}` | {name.replace("_", " ")} | Ambiguous queue evidence | faultline-queue | Native and CLI contract | Retained contrary intervals and policy-supported bounds | #81 #85 #92 | app | queue-localization | diagnosis v0.1 | faultline-queue | P0 | faultline-queue | no |' for name in names]
          path.write_text(text.rstrip() + '\n\n## Ambiguous queue evidence contracts\n\n| Test | Problem | Fixture | Crate | Artifact | Invariant | References | Tier | Requirement | Contract | Mutation surface | Priority | Owner | Human review |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n' + '\n'.join(rows) + '\n')
          PY
          cargo fmt --all
          cargo test --locked -p faultline-integration -p faultline-queue --all-targets 2>&1 | tee "$RUNNER_TEMP/queue-ambiguity/green.log"
          cargo clippy --no-deps --locked -p faultline-integration -p faultline-queue --all-targets -- -D warnings 2>&1 | tee "$RUNNER_TEMP/queue-ambiguity/clippy.log"
      - uses: actions/cache@v4
        id: tools
        with:
          path: |
            ~/.cargo/bin/cargo-insta
            ~/.cargo/bin/ripr
          key: ${{ runner.os }}-${{ runner.arch }}-verification-tools-insta-1.46.1-ripr-0.10.0
      - name: Install qualification tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-insta --locked --version 1.46.1
          cargo install ripr --locked --version 0.10.0
      - name: Qualify and package exact candidate
        run: |
          test "$(cargo insta --version)" = 'cargo-insta 1.46.1'
          test "$(ripr --version)" = 'ripr 0.10.0'
          cargo xtask ci-full 2>&1 | tee "$RUNNER_TEMP/queue-ambiguity/full.log"
          cargo xtask badges
          cargo xtask badges --check
          cargo fmt --all -- --check
          git diff --check
          git add crates/faultline-integration/src/lib.rs crates/faultline-queue/src/lib.rs crates/faultline-queue/src/main.rs crates/faultline-queue/tests/ambiguity.rs docs/queue-diagnosis.md docs/scenarios/scenario_index.md badges/ripr.json
          git commit -m 'fix(queue): retain nonmonotonic evidence and tight supported conflict bounds'
          test "$(git rev-parse HEAD^)" = "$INPUT_SHA"
          test -z "$(git status --porcelain)"
          git branch qualified-queue-ambiguity
          git bundle create "$RUNNER_TEMP/queue-ambiguity/candidate.bundle" "$INPUT_SHA"..qualified-queue-ambiguity
          git rev-parse HEAD > "$RUNNER_TEMP/queue-ambiguity/qualified-sha.txt"
          git diff "$INPUT_SHA" HEAD > "$RUNNER_TEMP/queue-ambiguity/reviewed.patch"
          git archive --format=tar HEAD > "$RUNNER_TEMP/queue-ambiguity/source.tar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-ambiguity-review
          path: ${{ runner.temp }}/queue-ambiguity
          if-no-files-found: error
          retention-days: 14
  compatibility:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: '1.93.0'
          - os: windows-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: queue-ambiguity-review
          path: ${{ runner.temp }}/queue-ambiguity
      - name: Select qualified source
        run: |
          git fetch "$RUNNER_TEMP/queue-ambiguity/candidate.bundle" refs/heads/qualified-queue-ambiguity:refs/heads/qualified-queue-ambiguity
          git checkout --detach qualified-queue-ambiguity
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Qualify native contracts
        run: |
          rustc --version --verbose
          cargo test --locked -p faultline-integration -p faultline-queue --all-targets
          git diff --exit-code
  publish:
    needs: [qualify, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: queue-ambiguity-review
          path: ${{ runner.temp }}/queue-ambiguity
      - name: Publish only the qualified fast-forward
        run: |
          git fetch "$RUNNER_TEMP/queue-ambiguity/candidate.bundle" refs/heads/qualified-queue-ambiguity:refs/heads/qualified-queue-ambiguity
          test "$(git rev-parse qualified-queue-ambiguity^)" = "$INPUT_SHA"
          python3 - <<'PY'
          import os, subprocess
          allowed = {'crates/faultline-integration/src/lib.rs', 'crates/faultline-queue/src/lib.rs', 'crates/faultline-queue/src/main.rs', 'crates/faultline-queue/tests/ambiguity.rs', 'docs/queue-diagnosis.md', 'docs/scenarios/scenario_index.md', 'badges/ripr.json'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', os.environ['INPUT_SHA'], 'qualified-queue-ambiguity']).decode().splitlines())
          assert changed <= allowed, changed
          PY
          current=$(git ls-remote origin refs/heads/feat/queue-evidence-diagnosis | cut -f1)
          test "$current" = "$INPUT_SHA"
          git push origin qualified-queue-ambiguity:refs/heads/feat/queue-evidence-diagnosis
