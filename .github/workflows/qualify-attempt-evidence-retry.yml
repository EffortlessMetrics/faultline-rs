name: Qualify completed attempt evidence repair
on:
  push:
    branches: [work/attempt-evidence-qualification]
    paths: [.github/workflows/qualify-attempt-evidence-retry.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  BASE_SHA: d69900ae803af414b7f2db94efca8bf8cb3cfc63
  CARGO_TERM_COLOR: never
concurrency:
  group: attempt-evidence-qualification
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/jactionlint@9e87e8f34edfc00b849a27807e26eff9d00b936d
        with:
          config-file: .github/jactionlint.yaml
          profile: correctness
          online: false
          args: --shellcheck= --pyflakes=
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-queue-identities-final-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-queue-identifiers-
            ${{ runner.os }}-cargo-
      - name: Run pinned queue regression qualification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          recipe = subprocess.check_output(['git', 'show', 'b23db30021289d7ff40cdc57cc17e531f9cc6c58:.github/workflows/qualify-attempt-evidence.yml']).decode()
          lines = recipe.splitlines()
          name = '      - name: Reproduce identifier mismatch and qualify the fix'
          start = lines.index(name) + 2
          script = []
          for line in lines[start:]:
              if line and not line.startswith('          '): break
              script.append(line[10:] if line else '')
          Path(os.environ['RUNNER_TEMP'], 'queue.sh').write_text('\n'.join(script) + '\n')
          PY
          bash -e -o pipefail "$RUNNER_TEMP/queue.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-identity-proof
          path: ${{ runner.temp }}/queue-proof
          retention-days: 14
  producer:
    needs: queue
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: queue-identity-proof
          path: ${{ runner.temp }}/queue-proof
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-attempt-evidence-final-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-queue-identities-final-
            ${{ runner.os }}-queue-identifiers-
            ${{ runner.os }}-cargo-
      - name: Extract exact preparation and falsification scripts
        run: |
          cp tools/finish-attempt-evidence.py "$RUNNER_TEMP/finish.py"
          cp tools/finish-attempt-cli.py "$RUNNER_TEMP/finish-cli.py"
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          lines = subprocess.check_output(['git', 'show', 'b23db30021289d7ff40cdc57cc17e531f9cc6c58:.github/workflows/qualify-attempt-evidence.yml']).decode().splitlines()
          wanted = {'Prepare exact candidate and run native persistence contracts': 'prepare.sh', 'Falsify the persistence and aggregation controls': 'mutants.sh', 'Canonical qualification and source bundle': 'full.sh'}
          name = None
          index = 0
          found = set()
          while index < len(lines):
              line = lines[index]
              if line.startswith('      - name: '): name = line.removeprefix('      - name: ')
              if line == '        run: |' and name in wanted:
                  index += 1
                  script = []
                  while index < len(lines) and (not lines[index] or lines[index].startswith('          ')):
                      script.append(lines[index][10:] if lines[index] else '')
                      index += 1
                  body = '\n'.join(script) + '\n'
                  if name.startswith('Prepare exact'):
                      old = 'python3 "$RUNNER_TEMP/prepare.py" producer'
                      assert body.count(old) == 1
                      body = body.replace(old, old + '\npython3 "$RUNNER_TEMP/finish.py"\npython3 "$RUNNER_TEMP/finish-cli.py"')
                  Path(os.environ['RUNNER_TEMP'], wanted[name]).write_text(body)
                  found.add(name)
                  continue
              index += 1
          assert found == set(wanted), found
          PY
      - name: Run persistence and whole-workspace tests
        env:
          ATTEMPT_TEST_SOURCE: ${{ runner.temp }}/attempt-evidence-tests.rs
        run: bash -e -o pipefail "$RUNNER_TEMP/prepare.sh"
      - name: Prove journal and aggregate regressions fail their deliberate mutants
        run: bash -e -o pipefail "$RUNNER_TEMP/mutants.sh"
      - uses: actions/cache@v4
        id: tools
        with:
          path: |
            ~/.cargo/bin/cargo-insta
            ~/.cargo/bin/ripr
          key: ${{ runner.os }}-${{ runner.arch }}-verification-tools-insta-1.46.1-ripr-0.10.0
      - name: Install pinned verification tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-insta --locked --version 1.46.1
          cargo install ripr --locked --version 0.10.0
      - name: Canonical qualification and candidate packaging
        run: bash -e -o pipefail "$RUNNER_TEMP/full.sh"
      - name: Retain candidate diff after failure
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/producer-proof"
          git diff > "$RUNNER_TEMP/producer-proof/worktree.diff"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: producer-attempt-proof
          path: ${{ runner.temp }}/producer-proof
          retention-days: 14
  compatibility:
    needs: producer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: '1.93.0'
          - os: windows-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: producer-attempt-proof
          path: ${{ runner.temp }}/producer-proof
      - name: Select qualified source
        run: |
          git fetch "$RUNNER_TEMP/producer-proof/source.bundle" refs/heads/qualified-attempt-evidence:refs/heads/qualified-attempt-evidence
          git checkout --detach qualified-attempt-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test attempt producer and queue contracts
        run: |
          cargo test --locked -p faultline-app -p faultline-store -p faultline-queue -p faultline-integration --all-targets
          cargo test --locked -p faultline-rs --test attempt_modes
          git diff --exit-code
  publish:
    needs: [queue, producer, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: producer-attempt-proof
          path: ${{ runner.temp }}/producer-proof
      - name: Publish only the two qualified refs
        run: |
          git bundle verify "$RUNNER_TEMP/producer-proof/source.bundle"
          git fetch "$RUNNER_TEMP/producer-proof/source.bundle" refs/heads/qualified-attempt-evidence:refs/heads/qualified-attempt-evidence refs/heads/qualified-queue-identities:refs/heads/qualified-queue-identities
          test "$(git rev-parse qualified-queue-identities^)" = "$BASE_SHA"
          test "$(git rev-parse qualified-attempt-evidence^)" = "$(git rev-parse qualified-queue-identities)"
          python3 - <<'PY'
          import os, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'qualified-attempt-evidence']).decode().splitlines()
          allowed = {'Cargo.lock', 'schemas/analysis-report.schema.json', 'docs/probe-attempt-evidence.md', 'docs/scenarios/scenario_index.md', 'badges/ripr.json'}
          assert all(p in allowed or p.startswith('crates/') for p in changed), changed
          assert not subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'qualified-attempt-evidence', '--', '.github', 'tools'])
          PY
          test "$(git ls-remote origin refs/heads/feat/queue-evidence-diagnosis | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/heads/fix/retain-probe-attempts)"
          git push --atomic origin qualified-queue-identities:refs/heads/feat/queue-evidence-diagnosis qualified-attempt-evidence:refs/heads/fix/retain-probe-attempts
