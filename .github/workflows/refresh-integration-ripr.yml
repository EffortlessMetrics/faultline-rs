name: Refresh integration-domain RIPR receipt

on:
  push:
    branches:
      - feat/integration-sequence-domain
    paths:
      - .github/workflows/refresh-integration-ripr.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RIPR_VERSION: "0.10.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/integration-sequence-domain
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-integration-ripr-${{ hashFiles('**/Cargo.lock') }}

      - name: Install pinned RIPR
        run: cargo install ripr --locked --version "$RIPR_VERSION"

      - name: Regenerate and verify repository evidence
        run: |
          set -euxo pipefail
          cargo xtask badges
          cat badges/ripr.json
          cargo xtask badges --check
          cargo xtask ripr-pr --base origin/main --head HEAD
          cargo xtask ripr-pr --base origin/main --head HEAD --check
          cargo xtask ripr-review-comments --base origin/main --head HEAD
          cargo xtask ripr-review-comments --base origin/main --head HEAD --check
          cargo xtask ripr-pr-summary
          cargo xtask ripr-pr-summary --check
          cargo xtask ripr-annotations
          cargo xtask ripr-annotations --check
          cargo xtask impacted-evidence

      - name: Commit authoritative Linux receipt
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-integration-ripr.yml
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add Cargo.lock badges/ripr.json .github/workflows/refresh-integration-ripr.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No receipt changes"
            exit 0
          fi
          git commit -m "verification: refresh integration-domain RIPR receipt"
          git push origin HEAD:feat/integration-sequence-domain
