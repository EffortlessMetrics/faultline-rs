name: CI Full

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: full-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INSTA_VERSION: "1.46.1"
  # When bumping RIPR, sync schemas/ripr/*.schema.json to the output shape.
  RIPR_VERSION: "0.10.0"

jobs:
  ci-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache pinned verification tools
        id: verification-tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-insta
            ~/.cargo/bin/ripr
          key: ${{ runner.os }}-${{ runner.arch }}-verification-tools-insta-${{ env.CARGO_INSTA_VERSION }}-ripr-${{ env.RIPR_VERSION }}

      - name: Install pinned verification tools
        if: steps.verification-tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-insta --locked --version "$CARGO_INSTA_VERSION"
          cargo install ripr --locked --version "$RIPR_VERSION"

      - name: Verify verification tool versions
        run: |
          test "$(cargo insta --version)" = "cargo-insta $CARGO_INSTA_VERSION"
          test "$(ripr --version)" = "ripr $RIPR_VERSION"

      - run: cargo xtask ci-full

      - name: RIPR verification evidence
        run: |
          cargo xtask badges --check
          cargo xtask ripr-pr --base origin/main --head HEAD
          cargo xtask ripr-pr --base origin/main --head HEAD --check
          cargo xtask ripr-review-comments --base origin/main --head HEAD
          cargo xtask ripr-review-comments --base origin/main --head HEAD --check
          cargo xtask ripr-pr-summary
          cargo xtask ripr-pr-summary --check
          cargo xtask ripr-annotations
          cargo xtask ripr-annotations --check
          cargo xtask impacted-evidence

      - name: Append RIPR PR evidence summary
        if: always()
        run: |
          if [ -f target/ripr/pr/summary.md ]; then
            cat target/ripr/pr/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "RIPR PR evidence summary was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ripr-verification-evidence
          path: |
            target/ripr/pr
            target/ripr/review
            target/xtask/impacted-evidence
          if-no-files-found: warn
