name: Release Check

on:
  push:
    branches: ["main", "release/**"]
    tags: ["faultline-rs-v0.0.1"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

concurrency:
  group: release-faultline-rs-0.0.1
  cancel-in-progress: false

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # A SHA-only checkout preserves annotated tags instead of peeling refs.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test release workflow contracts
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          python3 .github/tests/test_release_workflow.py
          echo "Validated workflow controller $GITHUB_WORKFLOW_SHA"

      - name: Validate release selection and tag
        id: selection
        run: python3 .github/scripts/release.py select

      - uses: dtolnay/rust-toolchain@1.93.1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-check-${{ runner.os }}-1.93.1-${{ hashFiles('**/Cargo.lock') }}

      - name: Install release check tools
        run: cargo install --locked --profile dev --target-dir target/release-tools cargo-deny@0.19.0 cargo-audit@0.22.1 cargo-semver-checks@0.47.0

      - name: Release checks
        run: |
          version="$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "faultline-codes"))')"
          if [ "$version" = "0.0.1" ]; then
            cargo xtask release-check --baseline-rev 9f6cba2cbd6ac381d732ebdd4f226704ec716217
          else
            cargo xtask release-check
          fi

      - name: Isolate cached package artifacts
        run: python3 .github/scripts/release.py isolate

      - name: Verify original published anchors
        run: python3 .github/scripts/release.py anchors

      - name: Verify package graph
        run: python3 .github/scripts/release.py package

      - name: Verify publication without uploading
        run: python3 .github/scripts/release.py dry-run

      - name: Inspect mixed-source archive identity and landing copy
        env:
          RELEASE_SOURCE_SHA: ${{ steps.selection.outputs.source_sha }}
        run: python3 .github/scripts/release.py inspect

      - name: Reconcile registry identities before publication
        run: python3 .github/scripts/release.py preflight

      - uses: actions/upload-artifact@v4
        with:
          name: crates-source-${{ steps.selection.outputs.source_sha }}
          path: |
            target/package/*.crate
            target/package/release-receipts.json
            target/package/package-file-lists.json
            target/published-anchors/*.crate
          if-no-files-found: error

      - name: Publish qualified packages to crates.io
        if: steps.selection.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: python3 .github/scripts/release.py publish

      - name: Verify published registry identities
        if: steps.selection.outputs.publish == 'true'
        run: python3 .github/scripts/release.py verify

      - name: Verify version-specific registry installation
        if: steps.selection.outputs.publish == 'true'
        run: |
          version="$(python3 -c 'import json,pathlib; print(json.loads(pathlib.Path(".github/release-0.0.1.json").read_text())["version"])')"
          cargo install faultline-rs --version "=$version" --registry crates-io --locked --jobs 1 --root "$RUNNER_TEMP/faultline-install"
          "$RUNNER_TEMP/faultline-install/bin/faultline-rs" --help
          test "$("$RUNNER_TEMP/faultline-install/bin/faultline-rs" --version)" = "faultline-rs $version"
