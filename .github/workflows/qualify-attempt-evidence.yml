name: Qualify attempt evidence repair

on:
  push:
    branches: [work/attempt-evidence-qualification]
    paths: [.github/workflows/qualify-attempt-evidence.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  BASE_SHA: d69900ae803af414b7f2db94efca8bf8cb3cfc63
  CARGO_TERM_COLOR: never

concurrency:
  group: attempt-evidence-qualification
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/jactionlint@9e87e8f34edfc00b849a27807e26eff9d00b936d
        with:
          config-file: .github/jactionlint.yaml
          profile: correctness
          online: false
          args: --shellcheck= --pyflakes=
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-queue-identifiers-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-queue-ambiguity-qualified-
            ${{ runner.os }}-cargo-
      - name: Reproduce identifier mismatch and qualify the fix
        run: |
          cp tools/prepare-attempt-evidence.py "$RUNNER_TEMP/prepare.py"
          git checkout --detach "$BASE_SHA"
          mkdir -p "$RUNNER_TEMP/queue-proof"
          python3 "$RUNNER_TEMP/prepare.py" queue
          cargo fmt --all
          cp crates/faultline-queue/src/lib.rs "$RUNNER_TEMP/fixed-lib.rs"
          git show "$BASE_SHA":crates/faultline-queue/src/lib.rs > crates/faultline-queue/src/lib.rs
          set +e
          cargo test --locked -p faultline-queue --test identifier_contract > "$RUNNER_TEMP/queue-proof/red.log" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/queue-proof/red.log"
          test "$code" -eq 101
          grep -F 'test planned_state_identifiers_must_be_receiptable ... FAILED' "$RUNNER_TEMP/queue-proof/red.log"
          grep -F '1 passed; 1 failed;' "$RUNNER_TEMP/queue-proof/red.log"
          cp "$RUNNER_TEMP/fixed-lib.rs" crates/faultline-queue/src/lib.rs
          cargo test --locked -p faultline-integration -p faultline-queue --all-targets 2>&1 | tee "$RUNNER_TEMP/queue-proof/green.log"
          cargo clippy --no-deps --locked -p faultline-queue --all-targets -- -D warnings
          cargo fmt --all -- --check
          git diff --check
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add crates/faultline-queue docs/scenarios/scenario_index.md
          git commit -m 'fix(queue): validate planned identities against receipt constraints'
          git branch qualified-queue-identities
          git rev-parse HEAD > "$RUNNER_TEMP/queue-proof/qualified-sha.txt"
          git bundle create "$RUNNER_TEMP/queue-proof/source.bundle" "$BASE_SHA"..qualified-queue-identities
          git diff "$BASE_SHA" HEAD > "$RUNNER_TEMP/queue-proof/patch.diff"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-identity-proof
          path: ${{ runner.temp }}/queue-proof
          retention-days: 14
  producer:
    needs: queue
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: queue-identity-proof
          path: ${{ runner.temp }}/queue-proof
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-attempt-evidence-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-queue-identifiers-
            ${{ runner.os }}-cargo-
      - name: Prepare exact candidate and run native persistence contracts
        env:
          ATTEMPT_TEST_SOURCE: ${{ runner.temp }}/attempt-evidence-tests.rs
        run: |
          cp tools/prepare-attempt-evidence.py "$RUNNER_TEMP/prepare.py"
          cp tools/attempt-evidence-tests.rs "$ATTEMPT_TEST_SOURCE"
          git fetch "$RUNNER_TEMP/queue-proof/source.bundle" refs/heads/qualified-queue-identities:refs/heads/qualified-queue-identities
          git checkout --detach qualified-queue-identities
          mkdir -p "$RUNNER_TEMP/producer-proof"
          git rev-parse HEAD > "$RUNNER_TEMP/producer-proof/input-sha.txt"
          rustc --version --verbose > "$RUNNER_TEMP/producer-proof/toolchain.txt"
          python3 "$RUNNER_TEMP/prepare.py" producer
          cargo fmt --all
          cargo test -p faultline-app --test attempt_evidence 2>&1 | tee "$RUNNER_TEMP/producer-proof/persistence-tests.log"
          cargo xtask generate-schema
          cargo test --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/producer-proof/workspace-tests.log"
      - name: Falsify the persistence and aggregation controls
        run: |
          cp crates/faultline-app/src/lib.rs "$RUNNER_TEMP/app-fixed.rs"
          cp crates/faultline-types/src/attempts.rs "$RUNNER_TEMP/aggregation-fixed.rs"
          trap 'cp "$RUNNER_TEMP/app-fixed.rs" crates/faultline-app/src/lib.rs; cp "$RUNNER_TEMP/aggregation-fixed.rs" crates/faultline-types/src/attempts.rs' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/faultline-app/src/lib.rs')
          s = p.read_text()
          old = 'self.store.save_probe_attempt(run, &observation)?;'
          assert s.count(old) == 1
          p.write_text(s.replace(old, '// Deliberate test mutant: discard completed attempt persistence.'))
          PY
          set +e
          cargo test --locked -p faultline-app --test attempt_evidence retry_attempts_survive_store_reopen_with_original_metadata > "$RUNNER_TEMP/producer-proof/mutant-journal.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 101
          grep -F 'test retry_attempts_survive_store_reopen_with_original_metadata ... FAILED' "$RUNNER_TEMP/producer-proof/mutant-journal.log"
          cp "$RUNNER_TEMP/app-fixed.rs" crates/faultline-app/src/lib.rs
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/faultline-types/src/attempts.rs')
          s = p.read_text()
          old = 'ObservationClass::Indeterminate'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'ObservationClass::Fail'))
          PY
          set +e
          cargo test --locked -p faultline-app --test attempt_evidence aggregate_never_borrows_first_attempt_process_metadata > "$RUNNER_TEMP/producer-proof/mutant-aggregation.log" 2>&1
          code=$?
          set -e
          test "$code" -eq 101
          grep -F 'test aggregate_never_borrows_first_attempt_process_metadata ... FAILED' "$RUNNER_TEMP/producer-proof/mutant-aggregation.log"
          cp "$RUNNER_TEMP/aggregation-fixed.rs" crates/faultline-types/src/attempts.rs
          cargo test --locked -p faultline-app --test attempt_evidence 2>&1 | tee "$RUNNER_TEMP/producer-proof/restored-tests.log"
      - uses: actions/cache@v4
        id: tools
        with:
          path: |
            ~/.cargo/bin/cargo-insta
            ~/.cargo/bin/ripr
          key: ${{ runner.os }}-${{ runner.arch }}-verification-tools-insta-1.46.1-ripr-0.10.0
      - name: Install pinned verification tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-insta --locked --version 1.46.1
          cargo install ripr --locked --version 0.10.0
      - name: Canonical qualification and source bundle
        run: |
          test "$(cargo insta --version)" = 'cargo-insta 1.46.1'
          test "$(ripr --version)" = 'ripr 0.10.0'
          cargo xtask ci-full 2>&1 | tee "$RUNNER_TEMP/producer-proof/full.log"
          cargo xtask badges
          cargo xtask badges --check
          cargo fmt --all -- --check
          git diff --check
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add crates Cargo.lock schemas/analysis-report.schema.json docs/probe-attempt-evidence.md docs/scenarios/scenario_index.md badges/ripr.json
          git commit -m 'fix(app): retain raw probe attempts before deriving retry decisions'
          test -z "$(git status --porcelain)"
          git branch qualified-attempt-evidence
          git rev-parse HEAD > "$RUNNER_TEMP/producer-proof/qualified-sha.txt"
          git bundle create "$RUNNER_TEMP/producer-proof/source.bundle" "$BASE_SHA"..qualified-attempt-evidence qualified-queue-identities
          git diff qualified-queue-identities HEAD > "$RUNNER_TEMP/producer-proof/patch.diff"
          git archive --format=tar HEAD > "$RUNNER_TEMP/producer-proof/source.tar"
      - name: Retain candidate diff even after a failed qualification
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/producer-proof"
          git diff > "$RUNNER_TEMP/producer-proof/worktree.diff"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: producer-attempt-proof
          path: ${{ runner.temp }}/producer-proof
          retention-days: 14
  compatibility:
    needs: producer
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: '1.93.0'
          - os: windows-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: producer-attempt-proof
          path: ${{ runner.temp }}/producer-proof
      - name: Select qualified source
        run: |
          git fetch "$RUNNER_TEMP/producer-proof/source.bundle" refs/heads/qualified-attempt-evidence:refs/heads/qualified-attempt-evidence
          git checkout --detach qualified-attempt-evidence
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Test attempt producer and queue contracts
        run: |
          cargo test --locked -p faultline-app -p faultline-store -p faultline-queue -p faultline-integration --all-targets
          git diff --exit-code
  publish:
    needs: [queue, producer, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: producer-attempt-proof
          path: ${{ runner.temp }}/producer-proof
      - name: Publish only the two qualified candidate refs
        run: |
          git bundle verify "$RUNNER_TEMP/producer-proof/source.bundle"
          git fetch "$RUNNER_TEMP/producer-proof/source.bundle" refs/heads/qualified-attempt-evidence:refs/heads/qualified-attempt-evidence refs/heads/qualified-queue-identities:refs/heads/qualified-queue-identities
          test "$(git rev-parse qualified-queue-identities^)" = "$BASE_SHA"
          test "$(git rev-parse qualified-attempt-evidence^)" = "$(git rev-parse qualified-queue-identities)"
          python3 - <<'PY'
          import os, subprocess
          changed = subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'qualified-attempt-evidence']).decode().splitlines()
          allowed = {'Cargo.lock', 'schemas/analysis-report.schema.json', 'docs/probe-attempt-evidence.md', 'docs/scenarios/scenario_index.md', 'badges/ripr.json'}
          assert all(p in allowed or p.startswith('crates/') for p in changed), changed
          assert not subprocess.check_output(['git', 'diff', '--name-only', os.environ['BASE_SHA'], 'qualified-attempt-evidence', '--', '.github', 'tools'])
          PY
          test "$(git ls-remote origin refs/heads/feat/queue-evidence-diagnosis | cut -f1)" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/heads/fix/retain-probe-attempts)"
          git push --atomic origin qualified-queue-identities:refs/heads/feat/queue-evidence-diagnosis qualified-attempt-evidence:refs/heads/fix/retain-probe-attempts
