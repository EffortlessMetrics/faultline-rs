name: Regenerate queue identity evidence
on:
  push:
    branches: [work/attempt-evidence-qualification]
    paths: [.github/workflows/queue-identity-badge.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 4f705acbeb948bbf80fbe936063be9fdafc8c693
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-queue-identity-badge-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - uses: actions/cache@v4
        id: tools
        with:
          path: |
            ~/.cargo/bin/cargo-insta
            ~/.cargo/bin/ripr
          key: ${{ runner.os }}-${{ runner.arch }}-verification-tools-insta-1.46.1-ripr-0.10.0
      - name: Install pinned tool
        if: steps.tools.outputs.cache-hit != 'true'
        run: cargo install ripr --locked --version 0.10.0
      - name: Generate exact-source evidence
        run: |
          test "$(ripr --version)" = 'ripr 0.10.0'
          test "$(git rev-parse HEAD)" = '4f705acbeb948bbf80fbe936063be9fdafc8c693'
          mkdir -p "$RUNNER_TEMP/queue-badge"
          cargo xtask badges 2>&1 | tee "$RUNNER_TEMP/queue-badge/generation.log"
          cargo xtask badges --check
          cp badges/ripr.json "$RUNNER_TEMP/queue-badge/ripr.json"
          git rev-parse HEAD > "$RUNNER_TEMP/queue-badge/source-sha.txt"
          git diff > "$RUNNER_TEMP/queue-badge/patch.diff"
          test "$(git diff --name-only)" = 'badges/ripr.json'
      - uses: actions/upload-artifact@v4
        with:
          name: queue-identity-badge
          path: ${{ runner.temp }}/queue-badge
          retention-days: 14
