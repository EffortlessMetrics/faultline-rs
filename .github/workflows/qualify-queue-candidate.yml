name: Qualify native queue candidate

on:
  push:
    branches: [feat/queue-evidence-diagnosis]
    paths: [.github/workflows/qualify-queue-candidate.yml]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: queue-candidate-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/jactionlint@9e87e8f34edfc00b849a27807e26eff9d00b936d # v2.5.0
        with:
          config-file: .github/jactionlint.yaml
          profile: correctness
          online: false
          args: --shellcheck= --pyflakes=
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-queue-candidate-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Start fresh qualification evidence
        run: |
          rm -rf target/queue-qualification
          mkdir -p target/queue-qualification
          git rev-parse HEAD > target/queue-qualification/input-sha.txt
          rustc --version --verbose > target/queue-qualification/toolchain.txt
      - name: Register scenarios and architecture, then format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('Cargo.toml')
          text = root.read_text()
          member = '  "crates/faultline-queue",\n'
          if member not in text:
              text = text.replace('  "crates/faultline-integration",\n', '  "crates/faultline-integration",\n' + member)
              root.write_text(text)
          additions = {
              'docs/crate-map.md': '\n\n## Queue evidence application\n\n`faultline-queue` validates captured phase receipts, aggregates immutable attempts and plans bounded probes through `faultline-localization`. Its library depends inward on `faultline-integration`, `faultline-types` and `faultline-codes`; its thin binary is the file/JSON/CLI adapter. It does not execute code, contact GitHub or mutate queues. See [queue diagnosis](queue-diagnosis.md).\n',
              'docs/verification-matrix.md': '\n\n## Queue diagnosis qualification\n\n`faultline-integration`: provenance/identity rejection, same-prefix tree witnesses, explicit localization basis, all 20 adjacent transition mappings and 128-case properties. `faultline-queue`: all 20 breakpoints within five midpoint launches, provider reuse, budgets, pending attempts, context mismatches, conflicting retries, operational failures and binary CLI contracts. Run `cargo test -p faultline-integration -p faultline-queue --all-targets`. These are synthetic contracts, not the live pilot.\n',
              'docs/architecture.md': '\n\n## Captured queue evidence\n\nThe `faultline-queue` application consumes resolved `faultline-integration` sequences and compatible phase evidence. It reuses the localization engine without re-linearizing Git history. Its separate native-launch ledger does not charge reused provider observations. A thin local-file binary exports JSON/Markdown and generated schemas; provider capture, object custody, isolated execution and Check publication remain separate adapters. See [queue diagnosis](queue-diagnosis.md).\n',
              'AGENTS.md': '\n\n## Native queue diagnosis\n\nSee [docs/queue-diagnosis.md](docs/queue-diagnosis.md). `faultline-queue` is an offline evidence application, not a predicate executor or queue controller. Verify its contracts with `cargo test -p faultline-integration -p faultline-queue --all-targets`; use `cargo run -p faultline-queue -- demo` for explicitly synthetic input. Unresolved diagnosis exits 2, not success.\n',
          }
          for filename, addition in additions.items():
              path = Path(filename)
              text = path.read_text()
              heading = addition.strip().splitlines()[0]
              if heading not in text:
                  path.write_text(text.rstrip() + addition)
          path = Path('docs/scenarios/scenario_index.md')
          text = path.read_text()
          rows = []
          for crate in ('faultline-integration', 'faultline-queue'):
              for source in sorted(Path('crates', crate, 'tests').rglob('*.rs')):
                  names = re.findall(r'#\[test\]\s*fn\s+(\w+)', source.read_text())
                  for name in names:
                      if f'`{name}`' not in text:
                          rows.append(f'| `{name}` | {name.replace("_", " ")} | Synthetic cumulative states / phase receipts | {crate} | Native contract | Identity, claim strength and bounded work | #81 #83 #85 #86 | domain/app | queue-localization | diagnosis v0.1 | {crate} | P0 | {crate} | no |')
          if rows:
              path.write_text(text.rstrip() + '\n\n## Native queue evidence contracts\n\n| Test | Problem | Fixture | Crate | Artifact | Invariant | References | Tier | Requirement | Contract | Mutation surface | Priority | Owner | Human review |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n' + '\n'.join(rows) + '\n')
          PY
          cargo fmt --all
      - name: Prove old mapping fails the regression test
        run: |
          cp crates/faultline-integration/src/lib.rs /tmp/integration-fixed.rs
          trap 'cp /tmp/integration-fixed.rs crates/faultline-integration/src/lib.rs' EXIT
          git show 3ab1c6e50c854857e92de0e8d65901c2b4990911:crates/faultline-integration/src/lib.rs > crates/faultline-integration/src/lib.rs
          set +e
          cargo test -p faultline-integration --test no_unstated_first > target/queue-qualification/red.log 2>&1
          result=$?
          set -e
          cat target/queue-qualification/red.log
          test "$result" -ne 0
          grep -F 'an unstated assumption must not become a first-transition claim' target/queue-qualification/red.log
      - name: Qualify native contracts and fix mechanical lint suggestions
        run: |
          cargo test -p faultline-integration -p faultline-queue --all-targets 2>&1 | tee target/queue-qualification/green.log
          cargo clippy --no-deps --fix --allow-dirty --allow-staged -p faultline-integration -p faultline-queue --all-targets
          cargo fmt --all
          cargo clippy --no-deps -p faultline-integration -p faultline-queue --all-targets -- -D warnings 2>&1 | tee target/queue-qualification/clippy.log
          cargo test -p faultline-integration -p faultline-queue --all-targets 2>&1 | tee target/queue-qualification/qualified-tests.log
      - name: Cache pinned verification tools
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-insta
            ~/.cargo/bin/ripr
          key: ${{ runner.os }}-${{ runner.arch }}-verification-tools-insta-1.46.1-ripr-0.10.0
      - name: Install pinned verification tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-insta --locked --version 1.46.1
          cargo install ripr --locked --version 0.10.0
      - name: Workspace qualification without the temporary writer workflow
        run: |
          test "$(cargo insta --version)" = 'cargo-insta 1.46.1'
          test "$(ripr --version)" = 'ripr 0.10.0'
          rm .github/workflows/qualify-queue-candidate.yml
          cargo xtask ci-full 2>&1 | tee target/queue-qualification/full.log
          cargo xtask badges
          cargo xtask badges --check
          cargo fmt --all -- --check
          git diff --check
      - name: Install binary and replay its generated demonstration
        run: |
          cargo install --path crates/faultline-queue --locked --debug --root target/queue-install
          target/queue-install/bin/faultline-queue --help
          target/queue-install/bin/faultline-queue schema input > target/queue-qualification/input.schema.json
          target/queue-install/bin/faultline-queue schema report > target/queue-qualification/report.schema.json
          target/queue-install/bin/faultline-queue demo > target/queue-qualification/demo.json
          set +e
          target/queue-install/bin/faultline-queue diagnose --input target/queue-qualification/demo.json --output target/queue-qualification/plan.json
          code=$?
          set -e
          test "$code" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('target/queue-qualification/plan.json').read_text())
          assert plan['status'] == 'needs_evidence'
          assert plan['next_probe']['state']['ordinal'] == 10
          assert plan['recorded_launches'] == 0
          print('Installed binary: unresolved exit 2, midpoint S10, zero launches.')
          PY
      - name: Package only the qualified commit for publication
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add Cargo.toml Cargo.lock AGENTS.md docs crates/faultline-integration crates/faultline-queue badges/ripr.json .github/workflows/qualify-queue-candidate.yml
          git commit -m 'feat(queue): qualify native evidence diagnosis and remove bootstrap'
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SHA"
          git branch qualified-candidate
          git bundle create /tmp/queue-candidate.bundle "$EXPECTED_SHA"..qualified-candidate
          git rev-parse HEAD | tee target/queue-qualification/qualified-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: queue-qualified-commit
          path: /tmp/queue-candidate.bundle
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: queue-qualification-evidence
          path: target/queue-qualification
          if-no-files-found: warn
          retention-days: 14
  publish:
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: queue-qualified-commit
          path: ${{ runner.temp }}/queue-qualified
      - name: Publish the qualified fast-forward with a branch lease
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BUNDLE: ${{ runner.temp }}/queue-qualified/queue-candidate.bundle
        run: |
          git bundle verify "$BUNDLE"
          git fetch "$BUNDLE" refs/heads/qualified-candidate:refs/heads/qualified-candidate
          test "$(git show -s --format=%P qualified-candidate)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          import os, subprocess
          allowed = {'Cargo.toml', 'Cargo.lock', 'AGENTS.md', 'docs/crate-map.md', 'docs/verification-matrix.md', 'docs/architecture.md', 'docs/scenarios/scenario_index.md', 'badges/ripr.json', '.github/workflows/qualify-queue-candidate.yml'}
          changed = subprocess.check_output(['git', 'diff', '--name-only', '-z', os.environ['EXPECTED_SHA'], 'qualified-candidate']).decode().split('\0')
          assert all(not p or p in allowed or p.startswith(('crates/faultline-integration/', 'crates/faultline-queue/')) for p in changed), changed
          deleted = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=D', os.environ['EXPECTED_SHA'], 'qualified-candidate']).decode().splitlines()
          assert '.github/workflows/qualify-queue-candidate.yml' in deleted
          PY
          current=$(git ls-remote origin refs/heads/feat/queue-evidence-diagnosis | cut -f1)
          test "$current" = "$EXPECTED_SHA"
          git push origin qualified-candidate:refs/heads/feat/queue-evidence-diagnosis
