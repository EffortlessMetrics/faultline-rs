name: Qualify final attempt evidence source
on:
  push:
    branches: [work/attempt-evidence-qualification]
    paths: [.github/workflows/normalize-attempt-candidate-retry.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  INPUT_SHA: 3cab51d0f5a71dd5e6938e3deef0294eaee30eb4
  QUEUE_SHA: d168c05992eca029df5644a38247f1428e2744db
  CARGO_TERM_COLOR: never
concurrency:
  group: attempt-evidence-final-diff
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/jactionlint@9e87e8f34edfc00b849a27807e26eff9d00b936d
        with:
          config-file: .github/jactionlint.yaml
          profile: correctness
          online: false
          args: --shellcheck= --pyflakes=
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-attempt-evidence-review-final-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-attempt-evidence-final-
            ${{ runner.os }}-cargo-
      - uses: actions/cache@v4
        id: tools
        with:
          path: |
            ~/.cargo/bin/cargo-insta
            ~/.cargo/bin/ripr
          key: ${{ runner.os }}-${{ runner.arch }}-verification-tools-insta-1.46.1-ripr-0.10.0
      - name: Install pinned verification tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-insta --locked --version 1.46.1
          cargo install ripr --locked --version 0.10.0
      - name: Qualify exact normalized source and regenerate evidence
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          lines = subprocess.check_output(['git', 'show', 'f929cd5abd751ba2282026ed4acd5e7c6c677aec:.github/workflows/normalize-attempt-candidate.yml']).decode().splitlines()
          start = lines.index('      - name: Preserve existing source encoding and correct scenario descriptions') + 2
          script = []
          for line in lines[start:]:
              if line and not line.startswith('          '): break
              script.append(line[10:] if line else '')
          body = '\n'.join(script) + '\n'
          old = 'cargo xtask badges --check'
          assert body.count(old) == 1
          body = body.replace(old, 'cargo xtask badges\n' + old)
          old = 'git add crates docs/scenarios/scenario_index.md'
          assert body.count(old) == 1
          body = body.replace(old, old + ' badges/ripr.json')
          Path(os.environ['RUNNER_TEMP'], 'normalize.sh').write_text(body)
          PY
          bash -e -o pipefail "$RUNNER_TEMP/normalize.sh"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-attempt-proof
          path: ${{ runner.temp }}/final-attempt-proof
          retention-days: 14
  compatibility:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: '1.93.0'
          - os: windows-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: final-attempt-proof
          path: ${{ runner.temp }}/final-attempt-proof
      - name: Select exact final source
        run: |
          git fetch "$RUNNER_TEMP/final-attempt-proof/source.bundle" refs/heads/qualified-attempt-final:refs/heads/qualified-attempt-final
          git checkout --detach qualified-attempt-final
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Verify persistence and actual CLI behavior
        run: |
          cargo test --locked -p faultline-app --test attempt_evidence
          cargo test --locked -p faultline-rs --test attempt_modes
          git diff --exit-code
  publish:
    needs: [qualify, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: final-attempt-proof
          path: ${{ runner.temp }}/final-attempt-proof
      - name: Publish qualified source cleanup and regenerated badge
        run: |
          git fetch "$RUNNER_TEMP/final-attempt-proof/source.bundle" refs/heads/qualified-attempt-final:refs/heads/qualified-attempt-final
          test "$(git rev-parse qualified-attempt-final^)" = "$INPUT_SHA"
          git diff --ignore-space-at-eol --exit-code "$INPUT_SHA" qualified-attempt-final -- crates
          python3 - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', os.environ['INPUT_SHA'], 'qualified-attempt-final']).decode().splitlines()
          assert all(p in {'docs/scenarios/scenario_index.md', 'badges/ripr.json'} or (p.startswith('crates/') and p.endswith('.rs')) for p in paths), paths
          PY
          test "$(git ls-remote origin refs/heads/fix/retain-probe-attempts | cut -f1)" = "$INPUT_SHA"
          git push origin qualified-attempt-final:refs/heads/fix/retain-probe-attempts
