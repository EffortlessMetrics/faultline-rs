name: Finalize retained attempt candidate
on:
  push:
    branches: [work/attempt-evidence-qualification]
    paths: [.github/workflows/finalize-attempt-candidate.yml]
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  INPUT_SHA: 3cab51d0f5a71dd5e6938e3deef0294eaee30eb4
  QUEUE_BASE: d168c05992eca029df5644a38247f1428e2744db
  QUEUE_HEAD: 3c2f876e631e678dc670b8f424149861fe1ae51d
  CARGO_TERM_COLOR: never
concurrency:
  group: attempt-evidence-final-diff
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/jactionlint@9e87e8f34edfc00b849a27807e26eff9d00b936d
        with:
          config-file: .github/jactionlint.yaml
          profile: correctness
          online: false
          args: --shellcheck= --pyflakes=
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-attempt-final-reconciled-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-attempt-evidence-final-
            ${{ runner.os }}-cargo-
      - uses: actions/cache@v4
        id: tools
        with:
          path: |
            ~/.cargo/bin/cargo-insta
            ~/.cargo/bin/ripr
          key: ${{ runner.os }}-${{ runner.arch }}-verification-tools-insta-1.46.1-ripr-0.10.0
      - name: Install pinned verification tools
        if: steps.tools.outputs.cache-hit != 'true'
        run: |
          cargo install cargo-insta --locked --version 1.46.1
          cargo install ripr --locked --version 0.10.0
      - name: Reconcile the exact parent and preserve existing Rust line endings
        run: |
          git checkout --detach "$INPUT_SHA"
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          mkdir -p "$RUNNER_TEMP/final-attempt-proof"
          python3 - <<'PY'
          import os, subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', os.environ['QUEUE_BASE'], os.environ['QUEUE_HEAD']]).decode().splitlines())
          assert changed == {'docs/verification/queue-identities-2026-11-13.md', 'badges/ripr.json'}, changed
          PY
          git merge --no-ff --no-commit -X ours "$QUEUE_HEAD"
          test -z "$(git diff --name-only --diff-filter=U)"
          python3 - <<'PY'
          from pathlib import Path
          import os, subprocess
          base = os.environ['QUEUE_BASE']
          paths = subprocess.check_output(['git', 'diff', '--name-only', '--diff-filter=M', base, os.environ['INPUT_SHA']]).decode().splitlines()
          normalized = []
          for name in paths:
              if not name.endswith('.rs'): continue
              original = subprocess.check_output(['git', 'show', f'{base}:{name}'])
              current = Path(name).read_bytes()
              if original.count(b'\n') and original.count(b'\n') == original.count(b'\r\n'):
                  fixed = current.replace(b'\r\n', b'\n').replace(b'\n', b'\r\n')
                  assert fixed.replace(b'\r\n', b'\n') == current.replace(b'\r\n', b'\n')
                  Path(name).write_bytes(fixed)
                  normalized.append(name)
          Path(os.environ['RUNNER_TEMP'], 'final-attempt-proof', 'line-endings.txt').write_text('\n'.join(normalized) + '\n')
          p = Path('docs/scenarios/scenario_index.md')
          lines = p.read_text().splitlines()
          for index, line in enumerate(lines):
              for name in ('planned_state_identifiers_must_be_receiptable', 'bounded_unicode_state_identity_remains_usable'):
                  if line.startswith(f'| `{name}` |'):
                      lines[index] = f'| `{name}` | Planned identities match receipt constraints | Captured queue sequence | faultline-queue | Diagnosis packet | No unreceiptable probe | #81 #92 | app | queue-localization | diagnosis v0.1 | faultline-queue | P0 | faultline-queue | no |'
          p.write_text('\n'.join(lines) + '\n')
          PY
          git diff --ignore-space-at-eol --exit-code "$INPUT_SHA" -- crates
          cargo fmt --all -- --check
          cargo test --locked --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/final-attempt-proof/tests.log"
          cargo xtask ci-full 2>&1 | tee "$RUNNER_TEMP/final-attempt-proof/full.log"
          cargo xtask badges
          cargo xtask badges --check
          git -c core.whitespace=blank-at-eol,blank-at-eof,space-before-tab,cr-at-eol diff --check "$INPUT_SHA"
          git add crates docs/scenarios/scenario_index.md docs/verification/queue-identities-2026-11-13.md badges/ripr.json
          git commit -m 'chore: reconcile queue parent and preserve existing source line endings'
          test "$(git rev-parse HEAD^1)" = "$INPUT_SHA"
          test "$(git rev-parse HEAD^2)" = "$QUEUE_HEAD"
          test -z "$(git status --porcelain)"
          git branch qualified-attempt-final
          git rev-parse HEAD > "$RUNNER_TEMP/final-attempt-proof/qualified-sha.txt"
          rustc --version --verbose > "$RUNNER_TEMP/final-attempt-proof/toolchain.txt"
          git diff "$QUEUE_HEAD" HEAD > "$RUNNER_TEMP/final-attempt-proof/patch.diff"
          git diff --stat "$QUEUE_HEAD" HEAD > "$RUNNER_TEMP/final-attempt-proof/stat.txt"
          git bundle create "$RUNNER_TEMP/final-attempt-proof/source.bundle" "$INPUT_SHA"..qualified-attempt-final
          git archive --format=tar HEAD > "$RUNNER_TEMP/final-attempt-proof/source.tar"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-attempt-proof
          path: ${{ runner.temp }}/final-attempt-proof
          retention-days: 14
  compatibility:
    needs: qualify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: '1.93.0'
          - os: windows-latest
            toolchain: stable
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: final-attempt-proof
          path: ${{ runner.temp }}/final-attempt-proof
      - name: Select exact source
        run: |
          git fetch "$RUNNER_TEMP/final-attempt-proof/source.bundle" refs/heads/qualified-attempt-final:refs/heads/qualified-attempt-final
          git checkout --detach qualified-attempt-final
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Verify original attempts and actual CLI recovery modes
        run: |
          cargo test --locked -p faultline-app --test attempt_evidence
          cargo test --locked -p faultline-rs --test attempt_modes
          git diff --exit-code
  publish:
    needs: [qualify, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: final-attempt-proof
          path: ${{ runner.temp }}/final-attempt-proof
      - name: Publish only the qualified candidate with a branch lease
        run: |
          git fetch "$RUNNER_TEMP/final-attempt-proof/source.bundle" refs/heads/qualified-attempt-final:refs/heads/qualified-attempt-final
          test "$(git rev-parse qualified-attempt-final^1)" = "$INPUT_SHA"
          test "$(git rev-parse qualified-attempt-final^2)" = "$QUEUE_HEAD"
          git diff --ignore-space-at-eol --exit-code "$INPUT_SHA" qualified-attempt-final -- crates
          python3 - <<'PY'
          import os, subprocess
          paths = subprocess.check_output(['git', 'diff', '--name-only', os.environ['INPUT_SHA'], 'qualified-attempt-final']).decode().splitlines()
          allowed = {'docs/scenarios/scenario_index.md', 'docs/verification/queue-identities-2026-11-13.md', 'badges/ripr.json'}
          assert all(p in allowed or (p.startswith('crates/') and p.endswith('.rs')) for p in paths), paths
          PY
          test "$(git ls-remote origin refs/heads/fix/retain-probe-attempts | cut -f1)" = "$INPUT_SHA"
          git push origin qualified-attempt-final:refs/heads/fix/retain-probe-attempts
