name: Reconcile queue incident binding tests

on:
  push:
    branches:
      - feat/merge-group-incident-contract
    paths:
      - .github/workflows/patch-queue-incident-tests.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merge-group-incident-contract
          fetch-depth: 0

      - name: Reconcile fail-closed tests
        shell: python
        run: |
          from pathlib import Path

          path = Path("tools/sdlc/tests/test_queue_incident.py")
          text = path.read_text(encoding="utf-8")

          old = '''    def test_raw_event_digest_cannot_be_rebound_to_different_payload(self) -> None:
              incident = build_valid_incident()
              tampered = copy.deepcopy(incident)
              tampered["event"]["sha256"] = "b" * 64
              queue_incident.validate_incident(tampered)
              self.assertNotEqual(incident["event"]["sha256"], tampered["event"]["sha256"])
              # Raw events are retained separately. The incident validates their digest
              # shape, while the capture path binds parsed content to the exact raw body.
          '''.replace("\n              ", "\n    ").lstrip("\n")
          new = '''    def test_event_digest_cannot_diverge_from_initial_lifecycle(self) -> None:
              incident = build_valid_incident()
              tampered = copy.deepcopy(incident)
              tampered["event"]["sha256"] = "b" * 64
              with self.assertRaisesRegex(
                  queue_incident.QueueIncidentError,
                  "initial lifecycle digest does not match",
              ):
                  queue_incident.validate_incident(tampered)
          '''.replace("\n              ", "\n    ").lstrip("\n")
          if old not in text:
              raise SystemExit("obsolete raw-event test block not found")
          text = text.replace(old, new, 1)

          replacements = {
              '''            queue_incident.build_incident(
                event_payload=payload,
                raw_event=different_raw,
                queue_snapshot=snapshot,
                object_manifest=object_manifest(snapshot),
                delivery_id="delivery-mismatch",
                captured_at="2026-11-12T07:00:03Z",
                signature_verified=True,
            )''': '''            queue_incident.build_incident(
                event_payload=payload,
                raw_event=different_raw,
                queue_snapshot=snapshot,
                object_manifest=object_manifest(snapshot),
                delivery_id="delivery-mismatch",
                captured_at="2026-11-12T07:00:03Z",
                signature_verified=True,
            )''',
              '''            queue_incident.append_destroyed(
                incident=incident,
                event_payload=destroyed,
                raw_event=raw_event(event_payload("destroyed", "merged")),
                delivery_id="destroyed-mismatch",
                observed_at="2026-11-12T08:00:00Z",
                signature_verified=True,
            )''': '''            queue_incident.append_destroyed(
                incident=incident,
                event_payload=destroyed,
                raw_event=raw_event(event_payload("destroyed", "merged")),
                delivery_id="destroyed-mismatch",
                observed_at="2026-11-12T08:00:00Z",
                signature_verified=True,
            )''',
          }
          # Normalize the under-indented continuation lines introduced by the
          # prior mechanical insertion without depending on Black in CI.
          text = text.replace(
              '''            queue_incident.build_incident(
      event_payload=payload,
      raw_event=different_raw,
      queue_snapshot=snapshot,
      object_manifest=object_manifest(snapshot),
      delivery_id="delivery-mismatch",
      captured_at="2026-11-12T07:00:03Z",
      signature_verified=True,
            )''',
              replacements.popitem()[1] if False else '''            queue_incident.build_incident(
                event_payload=payload,
                raw_event=different_raw,
                queue_snapshot=snapshot,
                object_manifest=object_manifest(snapshot),
                delivery_id="delivery-mismatch",
                captured_at="2026-11-12T07:00:03Z",
                signature_verified=True,
            )''',
              1,
          )
          text = text.replace(
              '''            queue_incident.append_destroyed(
      incident=incident,
      event_payload=destroyed,
      raw_event=raw_event(event_payload("destroyed", "merged")),
      delivery_id="destroyed-mismatch",
      observed_at="2026-11-12T08:00:00Z",
      signature_verified=True,
            )''',
              '''            queue_incident.append_destroyed(
                incident=incident,
                event_payload=destroyed,
                raw_event=raw_event(event_payload("destroyed", "merged")),
                delivery_id="destroyed-mismatch",
                observed_at="2026-11-12T08:00:00Z",
                signature_verified=True,
            )''',
              1,
          )
          path.write_text(text, encoding="utf-8")

      - name: Verify SDLC tests
        run: python3 -m unittest discover -s tools/sdlc/tests -p 'test_*.py'

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name EffortlessSteven
          git config user.email 15812269+EffortlessSteven@users.noreply.github.com
          git add tools/sdlc/tests/test_queue_incident.py
          git diff --cached --check
          git commit -m "test(queue): enforce raw-event binding"
          git push origin HEAD:feat/merge-group-incident-contract
